AWSTemplateFormatVersion: "2010-09-09"
Description: Instancias EC2 de Frontend y Backend con rsa-ssh-modulo2

Parameters:
  Proyecto:
    Type: String
    Default: globomatics

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  TipoInstancia:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]

  ImagenLinux:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  FrontendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      KeyName: "rsa-ssh-modulo2"
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}-frontend"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      KeyName: "rsa-ssh-modulo2"
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}-backend"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

Outputs:
  IdFrontend:
    Description: ID de la instancia EC2 Frontend
    Value: !Ref FrontendInstance

  IpPublicaFrontend:
    Description: IP pública de la instancia Frontend
    Value: !GetAtt FrontendInstance.PublicIp

  IdBackend:
    Description: ID de la instancia EC2 Backend
    Value: !Ref BackendInstance

  IpPublicaBackend:
    Description: IP pública de la instancia Backend
    Value: !GetAtt BackendInstance.PublicIp